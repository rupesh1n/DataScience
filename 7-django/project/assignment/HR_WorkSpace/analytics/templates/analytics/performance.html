<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Performance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
:root {
  --bg:#0b1020; --panel:#121831; --text:#e8ecf1; --muted:#aab3c5;
  --border:#1f2741; --high:#22c55e; --medium:#f59e0b; --low:#ef4444;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,#0b1020 0%,#0d1328 100%);
  color:var(--text);
}

header{
  padding:24px 40px;
  border-bottom:1px solid var(--border);
  position:sticky; top:0;
  background:rgba(11,16,32,.85);
  backdrop-filter:blur(6px);
}

.container{
  width:100%;
  max-width:1600px;
  margin:0 auto;
  padding:20px 40px;
}

.grid{
  display:grid;
  grid-template-columns:3fr 2fr;
  gap:20px;
  margin-top:20px;
}

@media(max-width:1000px){
  .grid{grid-template-columns:1fr;}
}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,0));
  border:1px solid var(--border);
  border-radius:14px;
  padding:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.toolbar{
  display:flex;
  gap:15px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.btn{
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--border);
  padding:8px 14px;
  border-radius:10px;
  cursor:pointer;
}

.btn:hover{border-color:#4f8cff;color:white;}

.chart-wrapper{
  position:relative;
  height:420px;
  width:100%;
}

table{
  width:100%;
  border-collapse:collapse;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

thead th{
  text-align:left;
  padding:12px;
  background:#0f1730;
  color:var(--muted);
  border-bottom:1px solid var(--border);
  cursor:pointer;
}

tbody td{
  padding:12px;
  border-bottom:1px solid var(--border);
  color:#dbe3f4;
}

tbody tr:hover{background:rgba(255,255,255,.03);}

.empty{color:var(--muted);padding:12px 0;}
footer{color:var(--muted);font-size:13px;margin-top:20px;text-align:center;}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

<header>
<h1>Performance Dashboard</h1>
<p style="color:#aab3c5;margin:0;">
Stacked employee performance by department (High / Medium / Low)
</p>
</header>

<main class="container">

<div class="grid">

<section class="card">

<div class="toolbar">
<button id="refreshBtn" class="btn">↻ Refresh</button>
<button id="downloadCsvBtn" class="btn">⬇ Download CSV</button>
</div>

<div class="chart-wrapper">
<canvas id="perfChart"></canvas>
</div>

</section>

<section class="card">
<h2 style="margin-top:0;">Details</h2>

<table id="perfTable">
<thead>
<tr>
<th data-key="department">Department ▲▼</th>
<th data-key="segment">Segment ▲▼</th>
<th data-key="count">Count ▲▼</th>
</tr>
</thead>
<tbody></tbody>
</table>

<div id="empty" class="empty" style="display:none;">No data available</div>

</section>

</div>

<footer>
Data source: <code>/api/performance/</code>
</footer>

</main>

<script>
const API_URL="/api/performance/";
let rawData=[];
let chart;

function groupByDepartment(data){
const departments=[...new Set(data.map(d=>d.department))].sort();
const map={};
departments.forEach(d=>map[d]={High:0,Medium:0,Low:0});
data.forEach(r=>map[r.department][r.segment]=r.count);
return{departments,map};
}

function buildChart(data){
const ctx=document.getElementById("perfChart").getContext("2d");
const{departments,map}=groupByDepartment(data);

const datasets=[
{label:"High",data:departments.map(d=>map[d].High),backgroundColor:"#22c55e"},
{label:"Medium",data:departments.map(d=>map[d].Medium),backgroundColor:"#f59e0b"},
{label:"Low",data:departments.map(d=>map[d].Low),backgroundColor:"#ef4444"}
];

if(chart)chart.destroy();

chart=new Chart(ctx,{
type:"bar",
data:{labels:departments,datasets},
options:{
responsive:true,
maintainAspectRatio:false,
scales:{
x:{stacked:true,ticks:{color:"#dbe3f4"},grid:{color:"rgba(255,255,255,.05)"}},
y:{stacked:true,beginAtZero:true,ticks:{color:"#dbe3f4"},grid:{color:"rgba(255,255,255,.08)"}}
},
plugins:{legend:{labels:{color:"#dbe3f4"}}}
}
});
}

function renderTable(data){
const tbody=document.querySelector("#perfTable tbody");
const empty=document.getElementById("empty");
tbody.innerHTML="";
if(!data.length){empty.style.display="block";return;}
empty.style.display="none";
data.forEach(r=>{
const tr=document.createElement("tr");
tr.innerHTML=`<td>${r.department}</td><td>${r.segment}</td><td>${r.count}</td>`;
tbody.appendChild(tr);
});
}

async function load(){
try{
const res=await fetch(API_URL);
const json=await res.json();
rawData=json;
buildChart(json);
renderTable(json);
}catch(e){
console.error(e);
renderTable([]);
}
}

document.getElementById("refreshBtn").addEventListener("click",load);
load();
</script>

</body>
</html>
